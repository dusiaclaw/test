<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a1c12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Audio Shelf</title>
<style>
:root{
  --bg:#1d140d; --panel:#2a1c12; --panel2:#37261a; --ink:#f3e7d3; --dim:#bda98c;
  --accent:#e2a03f; --accent-ink:#2a1c12; --wood1:#8a5a2b; --wood2:#5e3b1a; --line:#4a3525; --danger:#e0705c;
}
[data-theme="light"]{
  --bg:#f4ecdf; --panel:#fffaf1; --panel2:#efe3cf; --ink:#2b1d10; --dim:#7a6650;
  --accent:#b46a12; --accent-ink:#fff; --wood1:#b98a55; --wood2:#8a5f33; --line:#dccbb0; --danger:#b8402b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,"Times New Roman",serif;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:4px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{font-size:11px;color:var(--dim);font-weight:normal;margin-left:6px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}
.ib:active{background:var(--panel2)}
main{padding:12px 12px 150px;max-width:640px;margin:0 auto}
h3{margin:22px 0 6px;font-size:17px}
.chips{display:flex;gap:8px;margin:4px 0 12px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-family:system-ui,sans-serif;font-size:14px;min-height:40px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.tools{display:flex;gap:8px;margin-bottom:12px}
.tools select{flex:1;min-width:0}
/* shelves */
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px 12px 0;position:relative;margin-bottom:26px;align-items:end}
.shelf::after{content:"";position:absolute;left:-4px;right:-4px;bottom:-14px;height:14px;border-radius:3px;
  background:linear-gradient(var(--wood1),var(--wood2));box-shadow:0 6px 10px rgba(0,0,0,.45)}
.bk{display:block;width:100%;text-align:left}
.cover{position:relative;aspect-ratio:1/1;border-radius:4px 4px 0 0;overflow:hidden;
  background:linear-gradient(135deg,hsl(var(--h) 45% 32%),hsl(var(--h) 50% 18%));
  box-shadow:0 -2px 8px rgba(0,0,0,.35);display:grid;place-items:center}
.cover span{padding:8px;text-align:center;color:#f6ead6;font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .flag{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;font:600 10px system-ui,sans-serif;padding:2px 5px;border-radius:3px}
.cover .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.5)}
.cover .bar i{display:block;height:100%;background:var(--accent)}
.empty{text-align:center;color:var(--dim);padding:40px 20px}
.cont{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-bottom:16px}
.cont .cover{width:64px;flex:none;border-radius:4px}
.cont .m{flex:1;min-width:0;text-align:left}
.cont .m b,.cont .m small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont .m small{color:var(--dim);font-family:system-ui,sans-serif}
.cont .m em{font:600 11px system-ui,sans-serif;color:var(--accent);font-style:normal;text-transform:uppercase;letter-spacing:.04em}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 16px system-ui,sans-serif}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
/* book */
.hero{display:flex;gap:14px;margin-bottom:14px}
.hero .cover{width:120px;flex:none;border-radius:6px;align-self:flex-start}
.hero h2{margin:0 0 4px;font-size:20px;line-height:1.2}
.hero p{margin:0;color:var(--dim)}
.rate{font:600 14px system-ui,sans-serif;color:var(--accent)}
.rate small{font-weight:normal;color:var(--dim)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row .btn{flex:1}
.list{list-style:none;margin:14px 0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 4px;min-height:52px}
.ch .n{width:28px;color:var(--dim);font:14px system-ui,sans-serif;text-align:right;flex:none}
.ch .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .d{color:var(--dim);font:13px system-ui,sans-serif;flex:none}
.ch.cur .t{color:var(--accent);font-weight:bold}
.ch.done .t{color:var(--dim)}
.bp{margin:4px 0 12px}
.bpbar{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin-bottom:6px}
.bpbar i{display:block;height:100%;width:0;background:var(--accent)}
.bp .times b{color:var(--ink)}
.desc{white-space:pre-line;font-size:15px}
#ytBox{width:100%;aspect-ratio:16/9;margin:6px 0 4px;border-radius:8px;overflow:hidden;background:#000}
#ytBox iframe{width:100%;height:100%;border:0;display:block}
#sheet.bg{display:flex;transform:translateX(-300vw);pointer-events:none}
#pocket{position:fixed;inset:0;z-index:60;background:#000;display:none;place-items:center;touch-action:none;user-select:none;-webkit-user-select:none}
#pocket.on{display:grid}
#pocket p{color:#666;font:14px system-ui,sans-serif;transition:opacity 1s;text-align:center;padding:24px}
textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:inherit;font:15px system-ui,sans-serif}
/* forms */
label{display:block;margin:12px 0 4px;font:600 14px system-ui,sans-serif;color:var(--dim)}
input[type=text],input[type=search],select{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-family:system-ui,sans-serif}
.filebtn{display:block}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.note{color:var(--dim);font:14px system-ui,sans-serif;margin:8px 0}
.res{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.res .open{display:flex;gap:12px;align-items:center;flex:1;min-width:0;text-align:left}
.res .cover{width:64px;flex:none;border-radius:4px}
.res .m{flex:1;min-width:0}
.res .m b{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.res .m small{color:var(--dim);font-family:system-ui,sans-serif;display:block}
.site{display:block;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:10px 0;color:inherit;text-decoration:none}
.site b{color:var(--accent)} .site small{display:block;color:var(--dim);font-family:system-ui,sans-serif;margin-top:2px}
.er{display:flex;gap:6px;align-items:center;margin:6px 0}
.er input{flex:1;min-width:0}
.er .ib{border:1px solid var(--line);border-radius:10px;font-size:16px}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-family:system-ui,sans-serif;width:100%;text-align:left}
.sw i{flex:none;width:52px;height:30px;border-radius:15px;background:var(--panel2);border:1px solid var(--line);position:relative}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--dim);transition:left .15s}
.sw.on i{background:var(--accent);border-color:var(--accent)} .sw.on i::after{left:25px;background:var(--accent-ink)}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px} .stat small{color:var(--dim);font-family:system-ui,sans-serif}
.bars{display:flex;gap:6px;align-items:flex-end;height:120px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font:11px system-ui,sans-serif;color:var(--dim)}
.bars i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px}
/* player */
#mini{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--line);display:none;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#mini.on{display:flex;align-items:center;gap:10px}
#mini .cover{width:48px;flex:none;border-radius:4px}
#mini .cover span{font-size:9px;padding:2px;-webkit-line-clamp:3}
#mini .m{flex:1;min-width:0;text-align:left}
#mini .m b,#mini .m small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .m small{color:var(--dim);font-family:system-ui,sans-serif}
#mini .prog{position:absolute;left:0;top:-2px;height:3px;background:var(--accent)}
#sheet{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column;padding:10px 20px calc(20px + env(safe-area-inset-bottom));overflow:auto}
#sheet.on{display:flex}
#sheet .cover{width:min(70vw,300px);margin:10px auto 18px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#sheet h2{margin:0;text-align:center;font-size:20px}
#sheet p{margin:4px 0 0;text-align:center;color:var(--dim)}
#sheet .chn{color:var(--accent);margin-top:10px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px;margin-top:16px}
.times{display:flex;justify-content:space-between;color:var(--dim);font:13px system-ui,sans-serif}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.ctl .ib{width:56px;height:56px;font-size:15px;font-family:system-ui,sans-serif;font-weight:600}
.ctl .ib.big{width:76px;height:76px;background:var(--accent);color:var(--accent-ink);font-size:30px}
.ctl .ib.sk{font-size:26px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;font:14px system-ui,sans-serif;z-index:40;display:none;max-width:90vw;text-align:center}
#modal{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;place-items:center;padding:20px}
#modal.on{display:grid}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;max-width:420px;width:100%;max-height:80vh;overflow:auto}
#modal h3{margin:0 0 8px}
#modal ul{padding-left:20px;margin:8px 0;font-family:system-ui,sans-serif;font-size:15px}
</style>
</head>
<body>
<header>
  <button class="ib" id="back" hidden aria-label="Back">←</button>
  <h1 id="title">Audio Shelf</h1>
  <button class="ib" id="btnStats" aria-label="Stats"><svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor"><rect x="3" y="11" width="4" height="8" rx="1"/><rect x="9" y="6" width="4" height="13" rx="1"/><rect x="15" y="2" width="4" height="17" rx="1"/></svg></button>
  <button class="ib" id="btnAdd" aria-label="Add">＋</button>
  <button class="ib" id="btnSet" aria-label="Settings">⚙</button>
</header>
<main id="main"></main>

<div id="mini">
  <div class="prog" id="miniProg"></div>
  <button id="miniOpen" style="display:flex;gap:10px;align-items:center;flex:1;min-width:0">
    <div id="miniCover"></div>
    <div class="m"><b id="miniT"></b><small id="miniC"></small></div>
  </button>
  <button class="ib" id="miniPlay" aria-label="Play/Pause">▶</button>
</div>

<div id="sheet">
  <div style="display:flex;justify-content:space-between">
    <button class="ib" id="shClose" aria-label="Close">⌄</button>
    <button class="ib" id="shList" aria-label="Chapters">☰</button>
  </div>
  <div id="shCover"></div>
  <div id="ytWrap" hidden><div id="ytBox"><div id="ytFrame"></div></div><p class="note" id="ytTap" style="text-align:center;margin:0 0 6px"></p></div>
  <h2 id="shT"></h2><p id="shA"></p><p class="chn" id="shC"></p>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="ctl">
    <button class="ib sk" id="prev" aria-label="Previous chapter">⏮</button>
    <button class="ib" id="rw" aria-label="Skip back">−15</button>
    <button class="ib big" id="play" aria-label="Play/Pause">▶</button>
    <button class="ib" id="ff" aria-label="Skip forward">+30</button>
    <button class="ib sk" id="next" aria-label="Next chapter">⏭</button>
  </div>
  <div class="row sans">
    <button class="btn ghost" id="speed">1×</button>
    <button class="btn ghost" id="sleep">☾</button>
    <button class="btn ghost" id="pocketBtn" hidden></button>
  </div>
</div>
<div id="modal"><div class="box"><h3 id="mT"></h3><div id="mB"></div><div class="row" id="mBtns"></div></div></div>
<div id="pocket"><p id="pocketHint"></p></div>
<div id="toast"></div>
<audio id="au" preload="metadata"></audio>
<audio id="au2" preload="metadata"></audio>

 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

  if(!b.hasCover&&b.coverUrl){try{const r=await fetch(b.coverUrl);if(r.ok){const bl=await r.blob();await dbPut('covers',bl,b.id);b.hasCover=true;coverUrls[b.id]=URL.createObjectURL(bl)}}catch(e){}}
  for(let i=0;i<b.chapters.length&&!job.stop;i++){const c=b.chapters[i];if(c.off)continue;
   if(wifi()){toast(t('wifiOnly'));break}
   const r=await fetch(c.url);if(!r.ok)throw new Error(r.status);const bl=await r.blob();
   await dbPut('audio',bl,akey(b,i));c.off=true;c.size=bl.size;await saveBook(b);job.done++;rr()}
 }catch(e){toast(t('dlfail'))}
 delete dlJobs[b.id];rr();
}

/* YouTube books: played with YouTube's embedded player, nothing is downloaded */
const ytId=u=>{u=String(u).trim();const m=u.match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/|\/live\/)([\w-]{11})/);return m?m[1]:(/^[\w-]{11}$/.test(u)?u:'')};
const ytClean=s=>cleanTitle(String(s).split('|')[0]).replace(/\b(full|complete|unabridged|audio\s?books?|audiolibro|completo|integrale|lettura integrale)\b/gi,' ').replace(/\s+/g,' ').trim();
function parseStamps(txt){const out=[];
 for(const line of String(txt).split('\n')){const m=line.match(/(?:(\d{1,2}):)?(\d{1,2}):(\d{2})/);if(!m)continue;
  out.push({start:(+m[1]||0)*3600+(+m[2])*60+(+m[3]),title:line.replace(m[0],' ').replace(/^[\s\-–—:|.()\[\]]+|[\s\-–—:|.()\[\]]+$/g,'').trim()})}
 out.sort((a,b)=>a.start-b.start);return out.filter((c,i)=>!i||c.start>out[i-1].start)}
/* fill a field automatically unless the user has typed something of their own there */
function autoSet(el,val){if(!el||!val)return;if(!el.value||el.value===el.dataset.auto){el.value=val;el.dataset.auto=val}}
const NOISE=/\b(full|complete|unabridged|audio\s?books?|audiolibr[oi]|complet[oa]|integrale|lettura|versione|hd|hq)\b/gi;
function guessLang(s){const w=String(s).toLowerCase().split(/[^a-zàèéìòù]+/);
 const it=['il','lo','la','gli','le','di','del','della','dei','e','ed','un','una','audiolibro','capitolo','italiano','completo','integrale','letto','da','che','per','con','nel','al','i'],
  en=['the','of','and','a','an','audiobook','chapter','full','by','in','to','english','complete','unabridged','read','part','with','for'];
 let a=0,b=0;for(const x of w){if(it.includes(x))a++;if(en.includes(x))b++}return a>b?'it':b>a?'en':''}
const nameLike=s=>{const w=s.trim().split(/\s+/);return w.length>=2&&w.length<=4&&!/\d/.test(s)&&!/^(i|il|lo|la|le|gli|un|una|the|a|an)$/i.test(w[0])
 &&w.every(x=>/^\p{Lu}[\p{L}.'’-]*$/u.test(x)||/^(de|di|da|del|della|van|von|d')$/i.test(x))};
function ytGuess(raw){const lang=guessLang(raw);
 const tidy=x=>x.replace(/\s+/g,' ').replace(/^[\s\-–—|:,.]+|[\s\-–—|:,.]+$/g,'').trim();
 const s=tidy(String(raw).replace(/\(.*?\)|\[.*?\]|【.*?】/g,' ').replace(NOISE,' '));
 let title=s,author='';
 const m=s.match(/^(.+)\s+(?:by|di)\s+(.+)$/i);
 if(m&&nameLike(tidy(m[2]))){title=tidy(m[1]);author=tidy(m[2])}
 else{const parts=s.split(/\s+[-–—|]\s+|:\s+/).map(tidy).filter(Boolean);
  if(parts.length>=2){let ni=-1;parts.forEach((x,i)=>{if(nameLike(x))ni=i});
   if(ni>=0){author=parts[ni];title=parts.filter((_,i)=>i!==ni).join(' – ')}}}
 return {title:title||s||String(raw),author,lang}}

 setInterval(()=>{if(!vid||!ready)return;checkMeta();
  if(playing){if(end!=null&&now()>=end-0.25){fire('ended');return}fire('timeupdate')}},500);
 const o={id:'yt',errCode:0,
  addEventListener(ev,fn){(Ls[ev]=Ls[ev]||[]).push(fn)},
  open(v,s,e,rel,auto){const a=s+(rel||0);const same=ready&&v===vid;vid=v;start=s;end=e;o.errCode=0;
   if(same){if(Math.abs(now()-a)>2)yp.seekTo(a,true);if(auto)yp.playVideo();else yp.pauseVideo();setTimeout(()=>{if(meta)fire('loadedmetadata')},0)}
   else{meta=false;total=0;
    if(ready){want=null;if(auto)yp.loadVideoById({videoId:v,startSeconds:a});else yp.cueVideoById({videoId:v,startSeconds:a})}
    else{want={vid:v,abs:a};if(auto)create()}}},
  get total(){return total},
  get currentTime(){return Math.max(0,now()-start)},
  set currentTime(v){const a=start+Math.max(0,v);if(ready){if(Math.abs(now()-a)>1.5)yp.seekTo(a,true)}else if(want)want.abs=a},
  get duration(){return total?Math.max(0,(end??total)-start):NaN},
  get paused(){return !playing},
  get readyState(){return meta?4:0},
  get src(){return vid},
  getAttribute(){return vid||null},
  removeAttribute(){if(ready){try{yp.stopVideo()}catch(e){}}vid='';want=null;playing=false;meta=false;total=0},
  load(){},
  play(){if(ready)yp.playVideo();else create();return Promise.resolve()},
  pause(){if(ready){try{yp.pauseVideo()}catch(e){}}},
  get playbackRate(){return rate},
  set playbackRate(v){rate=v;if(ready){try{yp.setPlaybackRate(v)}catch(e){}}}};
 return o})();
const chapEnd=(b,ch)=>(b.chapters[ch+1]||{}).start??null;
const onAu=(ev,fn)=>[auS,auL,auY].forEach(el=>el.addEventListener(ev,e=>{if(el===au)fn(e)}));
const player={id:null,ch:0,url:null,seekTo:0,lastSave:0,sleepEnd:false,sleepT:null,sleepMin:0,pausedAt:0};
const SPEEDS=[0.75,1,1.25,1.5,1.75,2];let speed=+LS.get('speed',1)||1;
const skB=()=>+LS.get('skB','15')||15,skF=()=>+LS.get('skF','30')||30;
/* sound effects for on-phone audio: volume boost and skip silence */
let actx=null,gainN,anaN,silBuf,silT=null,silQuiet=0,silFast=false;
function ensureGraph(){if(actx)return true;
 try{const AC=window.AudioContext||window.webkitAudioContext;actx=new AC();const src=actx.createMediaElementSource(auL);
  gainN=actx.createGain();const comp=actx.createDynamicsCompressor();anaN=actx.createAnalyser();anaN.fftSize=1024;silBuf=new Float32Array(1024);
  src.connect(anaN);src.connect(gainN);gainN.connect(comp);comp.connect(actx.destination);return true}catch(e){actx=null;return false}}
function applyFx(){
 const boost=+LS.get('boost','0')||0,sil=LS.get('skipSil','0')==='1';
 if((boost||sil)&&au===auL&&player.id)ensureGraph();
 if(actx){gainN.gain.value=[1,1.5,2][boost]||1;if(actx.state==='suspended')actx.resume().catch(()=>{})}
 clearInterval(silT);silT=null;silQuiet=0;silFast=false;au.playbackRate=speed;
 if(sil&&actx&&au===auL)silT=setInterval(silTick,100);
}
function silTick(){if(au!==auL||au.paused||au.readyState<3)return;
 anaN.getFloatTimeDomainData(silBuf);let s=0;for(let i=0;i<silBuf.length;i++)s+=silBuf[i]*silBuf[i];
 if(Math.sqrt(s/silBuf.length)<0.006){silQuiet+=100;if(silQuiet>=600&&!silFast){silFast=true;au.playbackRate=Math.min(4,speed*3)}}
 else{silQuiet=0;if(silFast){silFast=false;au.playbackRate=speed}}}
async function playBook(id,ch,tm,auto=true){
 const b=book(id);if(!b||!b.chapters[ch])return;
 savePos();
 const c=b.chapters[ch];let src=c.url,blobUrl=null;
 if(c.off||b.source==='local'){const bl=await dbGet('audio',akey(b,ch));if(bl){blobUrl=URL.createObjectURL(bl);src=blobUrl}}
 const yt=b.source==='yt';
 if(!src&&!yt){toast(t('playErr'));return}
 const el=yt?auY:blobUrl?auL:auS;
 if(au!==el){const old=au;au=el;old.pause();old.removeAttribute('src');old.load()}
 if(player.url)URL.revokeObjectURL(player.url);player.url=blobUrl;
 player.id=id;player.ch=ch;player.seekTo=tm||0;
 if(yt)auY.open(b.ytId,c.start||0,chapEnd(b,ch),player.seekTo,auto);else au.src=src;
 au.playbackRate=speed;
 b.pos={ch,t:player.seekTo};if(auto){b.finished=false;b.lastPlayed=Date.now();player.pausedAt=0}else player.pausedAt=b.lastPlayed||0;
 saveBook(b);LS.set('last',id);
 applyFx();
 if(auto&&!yt)au.play().catch(()=>{});
 if(auto&&yt)openSheet();
 setMediaSession(b);updatePlayerUI();
 if(view.v==='book'&&view.id===id)renderBook($('#main'),b);
}
function stopPlayer(){au.pause();au.removeAttribute('src');au.load();player.id=null;updatePlayerUI()}
function savePos(){const b=book(player.id);if(!b||!au.src||au.readyState<1)return;
 b.pos={ch:player.ch,t:au.currentTime||0};const c=b.chapters[player.ch];if(c&&isFinite(au.duration)&&au.duration>0)c.dur=au.duration;saveBook(b)}
let statTick=0,statDirty=0;
onAu('loadedmetadata',()=>{if(player.seekTo>0&&player.seekTo<(au.duration||Infinity)-2)au.currentTime=player.seekTo;player.seekTo=0;au.playbackRate=speed;
 const b=book(player.id);if(b&&isFinite(au.duration)&&b.chapters[player.ch]){b.chapters[player.ch].dur=au.duration}
 if(b&&b.source==='yt'&&au===auY&&auY.total){b.chapters.forEach((c,i)=>{c.dur=Math.max(1,((b.chapters[i+1]||{}).start??auY.total)-c.start)});saveBook(b)}
 updateTime()});
onAu('timeupdate',()=>{updateTime();const n=Date.now();
 if(!au.paused){const d=(n-statTick)/1000;if(statTick&&d>0&&d<2){const k=dayKey();stats.days[k]=(stats.days[k]||0)+d;statDirty+=d;if(statDirty>10){statDirty=0;saveStats()}}statTick=n}
 if(n-player.lastSave>5000){player.lastSave=n;savePos()}});
onAu('pause',()=>{player.pausedAt=Date.now();statTick=0;savePos();saveStats();updatePlayerUI()});
onAu('play',()=>{statTick=0;
 if(actx&&actx.state==='suspended')actx.resume().catch(()=>{});
 const b=book(player.id);if(b){b.lastPlayed=Date.now();b.finished=false}
 if(player.pausedAt&&LS.get('autoRw','1')==='1'&&au.readyState>=1){const gap=Date.now()-player.pausedAt;const back=gap>36e5?30:gap>3e5?10:0;if(back)au.currentTime=Math.max(0,au.currentTime-back)}
 player.pausedAt=0;updatePlayerUI()});
onAu('ended',()=>{const b=book(player.id);if(!b)return;
 if(player.sleepEnd){player.sleepEnd=false;updateSleepLabel();if(player.ch<b.chapters.length-1)playBook(b.id,player.ch+1,0,false);return}
 if(player.ch<b.chapters.length-1)playBook(b.id,player.ch+1,0);
 else{b.pos={ch:0,t:0};b.finished=true;saveBook(b);stats.fin.push({id:b.id,title:b.title,at:Date.now()});saveStats();updatePlayerUI();if(view.v==='book'&&view.id===b.id)renderBook($('#main'),b)}});
onAu('error',()=>{if(!player.id||!au.getAttribute('src'))return;const c=au===auY?auY.errCode:0;toast(t(c===101||c===150?'ytBlocked':c===100?'ytGone':'playErr'))});
document.addEventListener('visibilitychange',()=>{if(document.hidden){savePos();saveStats()}});
window.addEventListener('pagehide',()=>{savePos();saveStats()});
function toggle(){if(!player.id)return;if(au===auY&&au.paused)openSheet();au.paused?au.play().catch(()=>{}):au.pause()}
function skip(d){if(!player.id)return;au.currentTime=Math.max(0,Math.min((au.duration||1e9)-1,au.currentTime+d))}
function chStep(d){const b=book(player.id);if(!b)return;
 if(d<0&&au.currentTime>5){au.currentTime=0;return}
 const n=player.ch+d;if(n>=0&&n<b.chapters.length)playBook(b.id,n,0)}
function updateTime(){
 const d=au.duration,c=au.currentTime||0;
 if(!seeking){$('#seek').value=isFinite(d)&&d>0?Math.round(c/d*1000):0;$('#tCur').textContent=fmt(c)}
 $('#tDur').textContent=isFinite(d)?fmt(d):'–:––';
 if(view.v==='book'&&view.id===player.id){const b=book(player.id);if(b)updateBookProg(b)}
 $('#miniProg').style.width=(isFinite(d)&&d>0?c/d*100:0)+'%';
}
function updatePlayerUI(){
 const b=book(player.id);const mini=$('#mini');
 mini.classList.toggle('on',!!b);const sh=$('#sheet');if(!b){sh.classList.remove('on','bg');return}
 const yt=b.source==='yt';sh.classList.toggle('bg',yt&&!sh.classList.contains('on'));
 $('#ytWrap').hidden=!yt;$('#shCover').hidden=yt;$('#pocketBtn').hidden=!yt;$('#pocketBtn').textContent=t('pocket');$('#ytTap').textContent=t('ytTapMsg');
 const c=b.chapters[player.ch]||b.chapters[0];const icon=au.paused?'▶':'❚❚';
 $('#miniPlay').textContent=icon;$('#play').textContent=icon;
 const key=b.id+'|'+coverSrc(b)+'|'+b.title;
 if(mini.dataset.k!==key){mini.dataset.k=key;$('#miniCover').innerHTML=coverHTML(b);$('#shCover').innerHTML=coverHTML(b)}
 $('#miniT').textContent=b.title;$('#miniC').textContent=(player.ch+1)+'. '+c.title;
 $('#shT').textContent=b.title;$('#shA').textContent=b.author||'';$('#shC').textContent=(player.ch+1)+'/'+b.chapters.length+' · '+c.title;
 $('#rw').textContent='−'+skB();$('#ff').textContent='+'+skF();
 $('#speed').textContent=speed+'×';updateSleepLabel();updateTime();
}
let seeking=false;
$('#seek').addEventListener('input',()=>{seeking=true;if(isFinite(au.duration))$('#tCur').textContent=fmt($('#seek').value/1000*au.duration)});
$('#seek').addEventListener('change',()=>{if(isFinite(au.duration))au.currentTime=$('#seek').value/1000*au.duration;seeking=false});
$('#miniPlay').onclick=toggle;$('#play').onclick=toggle;
$('#rw').onclick=()=>skip(-skB());$('#ff').onclick=()=>skip(skF());
$('#prev').onclick=()=>chStep(-1);$('#next').onclick=()=>chStep(1);
function openSheet(){const s=$('#sheet');if(s.classList.contains('on'))return;history.pushState(view,'');s.classList.remove('bg');s.classList.add('on')}
$('#miniOpen').onclick=openSheet;
/* pocket mode: keep the phone awake behind a black, touch-locked screen */
let wakeL=null,pkT=null;
async function wake(){try{if('wakeLock' in navigator){wakeL=await navigator.wakeLock.request('screen');return true}}catch(e){}return false}
const pkHint=on=>{const h=$('#pocketHint');h.textContent=t('pocketHint');h.style.opacity=on?1:0};
async function pocketOn(){if(!(await wake()))return toast(t('pocketNo'));
 history.pushState(view,'');$('#pocket').classList.add('on');pkHint(true);setTimeout(()=>pkHint(false),4000);
 try{const d=document.documentElement;if(d.requestFullscreen)d.requestFullscreen().catch(()=>{})}catch(e){}}
function pocketOff(){$('#pocket').classList.remove('on');clearTimeout(pkT);try{if(wakeL)wakeL.release()}catch(e){}wakeL=null;
 try{if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}catch(e){}}
$('#pocketBtn').onclick=pocketOn;
$('#pocket').addEventListener('pointerdown',e=>{e.preventDefault();pkHint(true);clearTimeout(pkT);pkT=setTimeout(()=>history.back(),2000)});
['pointerup','pointercancel','pointerleave'].forEach(ev=>$('#pocket').addEventListener(ev,()=>{clearTimeout(pkT);setTimeout(()=>pkHint(false),1500)}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&$('#pocket').classList.contains('on'))wake()});
$('#shClose').onclick=()=>history.back();
$('#shList').onclick=()=>{$('#sheet').classList.remove('on');view={v:'book',id:player.id};history.replaceState(view,'');render()};
$('#speed').onclick=()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];LS.set('speed',speed);silFast=false;au.playbackRate=speed;$('#speed').textContent=speed+'×'};
const SLEEPS=[0,15,30,60,-1];let sleepI=0;
$('#sleep').onclick=()=>{sleepI=(sleepI+1)%SLEEPS.length;const v=SLEEPS[sleepI];clearTimeout(player.sleepT);player.sleepEnd=false;player.sleepMin=0;
 if(v>0){player.sleepMin=v;player.sleepT=setTimeout(()=>{au.pause();sleepI=0;player.sleepMin=0;updateSleepLabel()},v*60000)}else if(v<0)player.sleepEnd=true;
 updateSleepLabel()};
function updateSleepLabel(){if(!player.sleepEnd&&!player.sleepMin)sleepI=0;
 $('#sleep').textContent=player.sleepEnd?t('sleepEnd'):player.sleepMin?t('sleepMin',player.sleepMin):t('sleepOff')}
function setMediaSession(b){
 if(!('mediaSession' in navigator))return;
 try{const s=coverSrc(b);
  navigator.mediaSession.metadata=new MediaMetadata({title:(player.ch+1)+'. '+b.chapters[player.ch].title,artist:b.author||'',album:b.title,artwork:s?[{src:s,sizes:'512x512'}]:[]});
  const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  h('play',()=>au.play());h('pause',()=>au.pause());
  h('seekbackward',()=>skip(-skB()));h('seekforward',()=>skip(skF()));
  h('previoustrack',()=>chStep(-1));h('nexttrack',()=>chStep(1));
  h('seekto',e=>{if(e.seekTime!=null)au.currentTime=e.seekTime});
 }catch(e){}
}
/* ---------- boot ---------- */
(async()=>{
 history.replaceState(view,'');
 try{await loadBooks()}catch(e){toast(String(e&&e.message||e))}
 render();
 const last=book(LS.get('last',''));
 if(last&&last.pos&&!last.finished)playBook(last.id,Math.min(last.pos.ch,last.chapters.length-1),last.pos.t,false);
 const prev=LS.get('lastVer','');LS.set('lastVer',VERSION);
 if(prev&&prev!==VERSION)showChangelog(CHANGELOG.filter(c=>newer(c.v,prev)),t('whatsNew')+' – v'+VERSION);
 if(location.protocol==='https:'){
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  checkUpdate(false);
 }
})();
