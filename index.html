<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a1c12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Audio Shelf</title>
<style>
:root{
  --bg:#1d140d; --panel:#2a1c12; --panel2:#37261a; --ink:#f3e7d3; --dim:#bda98c;
  --accent:#e2a03f; --accent-ink:#2a1c12; --wood1:#8a5a2b; --wood2:#5e3b1a; --line:#4a3525; --danger:#e0705c;
}
[data-theme="light"]{
  --bg:#f4ecdf; --panel:#fffaf1; --panel2:#efe3cf; --ink:#2b1d10; --dim:#7a6650;
  --accent:#b46a12; --accent-ink:#fff; --wood1:#b98a55; --wood2:#8a5f33; --line:#dccbb0; --danger:#b8402b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Georgia,"Times New Roman",serif;overscroll-behavior-y:contain}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:20px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1 small{font-size:11px;color:var(--dim);font-weight:normal;margin-left:6px}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;flex:none}
.ib:active{background:var(--panel2)}
main{padding:12px 12px 150px;max-width:640px;margin:0 auto}
.chips{display:flex;gap:8px;margin:4px 0 14px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--panel);font-family:system-ui,sans-serif;font-size:14px;min-height:40px}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
/* shelves */
.shelf{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:14px 12px 0;position:relative;margin-bottom:26px;align-items:end}
.shelf::after{content:"";position:absolute;left:-4px;right:-4px;bottom:-14px;height:14px;border-radius:3px;
  background:linear-gradient(var(--wood1),var(--wood2));box-shadow:0 6px 10px rgba(0,0,0,.45)}
.bk{display:block;width:100%;text-align:left}
.cover{position:relative;aspect-ratio:1/1;border-radius:4px 4px 0 0;overflow:hidden;
  background:linear-gradient(135deg,hsl(var(--h) 45% 32%),hsl(var(--h) 50% 18%));
  box-shadow:0 -2px 8px rgba(0,0,0,.35);display:grid;place-items:center}
.cover span{padding:8px;text-align:center;color:#f6ead6;font-size:13px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover .flag{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.65);color:#fff;font:600 10px system-ui,sans-serif;padding:2px 5px;border-radius:3px}
.cover .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.5)}
.cover .bar i{display:block;height:100%;background:var(--accent)}
.empty{text-align:center;color:var(--dim);padding:50px 20px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 18px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 16px system-ui,sans-serif}
.btn.ghost{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid var(--danger)}
.btn.wide{width:100%}
.btn:disabled{opacity:.5}
/* book */
.hero{display:flex;gap:14px;margin-bottom:14px}
.hero .cover{width:120px;flex:none;border-radius:6px}
.hero h2{margin:0 0 4px;font-size:20px;line-height:1.2}
.hero p{margin:0;color:var(--dim)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.row .btn{flex:1}
.list{list-style:none;margin:14px 0;padding:0;border-top:1px solid var(--line)}
.list li{border-bottom:1px solid var(--line)}
.ch{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:12px 4px;min-height:52px}
.ch .n{width:28px;color:var(--dim);font:14px system-ui,sans-serif;text-align:right;flex:none}
.ch .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .d{color:var(--dim);font:13px system-ui,sans-serif;flex:none}
.ch.cur .t{color:var(--accent);font-weight:bold}
.ch.done .t{color:var(--dim)}
/* forms */
label{display:block;margin:12px 0 4px;font:600 14px system-ui,sans-serif;color:var(--dim)}
input[type=text],input[type=search],select{width:100%;min-height:48px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-family:system-ui,sans-serif}
.filebtn{display:block}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.note{color:var(--dim);font:14px system-ui,sans-serif;margin:8px 0}
.res{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.res .cover{width:64px;flex:none;border-radius:4px}
.res .m{flex:1;min-width:0}
.res .m b{display:block;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.res .m small{color:var(--dim);font-family:system-ui,sans-serif}
.site{display:block;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:10px 0;color:inherit;text-decoration:none}
.site b{color:var(--accent)} .site small{display:block;color:var(--dim);font-family:system-ui,sans-serif;margin-top:2px}
/* player */
#mini{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--panel);border-top:1px solid var(--line);display:none;padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
#mini.on{display:flex;align-items:center;gap:10px}
#mini .cover{width:48px;flex:none;border-radius:4px}
#mini .m{flex:1;min-width:0;text-align:left}
#mini .m b,#mini .m small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini .m small{color:var(--dim);font-family:system-ui,sans-serif}
#mini .prog{position:absolute;left:0;top:-2px;height:3px;background:var(--accent)}
#sheet{position:fixed;inset:0;z-index:10;background:var(--bg);display:none;flex-direction:column;padding:10px 20px calc(20px + env(safe-area-inset-bottom));overflow:auto}
#sheet.on{display:flex}
#sheet .cover{width:min(70vw,300px);margin:10px auto 18px;border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#sheet h2{margin:0;text-align:center;font-size:20px}
#sheet p{margin:4px 0 0;text-align:center;color:var(--dim)}
#sheet .chn{color:var(--accent);margin-top:10px}
input[type=range]{width:100%;accent-color:var(--accent);height:32px;margin-top:16px}
.times{display:flex;justify-content:space-between;color:var(--dim);font:13px system-ui,sans-serif}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:14px 0}
.ctl .ib{width:56px;height:56px;font-size:15px;font-family:system-ui,sans-serif;font-weight:600}
.ctl .ib.big{width:76px;height:76px;background:var(--accent);color:var(--accent-ink);font-size:30px}
.ctl .ib.sk{font-size:26px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:20px;font:14px system-ui,sans-serif;z-index:20;display:none;max-width:90vw;text-align:center}
</style>
</head>
<body>
<header>
  <button class="ib" id="back" hidden aria-label="Back">←</button>
  <h1 id="title">Audio Shelf</h1>
  <button class="ib" id="btnAdd" aria-label="Add">＋</button>
  <button class="ib" id="btnSet" aria-label="Settings">⚙</button>
</header>
<main id="main"></main>

<div id="mini">
  <div class="prog" id="miniProg"></div>
  <button id="miniOpen" style="display:flex;gap:10px;align-items:center;flex:1;min-width:0">
    <div id="miniCover"></div>
    <div class="m"><b id="miniT"></b><small id="miniC"></small></div>
  </button>
  <button class="ib" id="miniPlay" aria-label="Play/Pause">▶</button>
</div>

<div id="sheet">
  <div style="display:flex;justify-content:space-between">
    <button class="ib" id="shClose" aria-label="Close">⌄</button>
    <button class="ib" id="shList" aria-label="Chapters">☰</button>
  </div>
  <div id="shCover"></div>
  <h2 id="shT"></h2><p id="shA"></p><p class="chn" id="shC"></p>
  <input type="range" id="seek" min="0" max="1000" value="0" aria-label="Position">
  <div class="times"><span id="tCur">0:00</span><span id="tDur">0:00</span></div>
  <div class="ctl">
    <button class="ib sk" id="prev" aria-label="Previous chapter">⏮</button>
    <button class="ib" id="rw" aria-label="Back 15 s">−15</button>
    <button class="ib big" id="play" aria-label="Play/Pause">▶</button>
    <button class="ib" id="ff" aria-label="Forward 30 s">+30</button>
    <button class="ib sk" id="next" aria-label="Next chapter">⏭</button>
  </div>
  <div class="row sans">
    <button class="btn ghost" id="speed">1×</button>
    <button class="btn ghost" id="sleep">☾</button>
  </div>
</div>
<div id="toast"></div>
<audio id="au" preload="metadata"></audio>

<script>
'use strict';
const VERSION='1.1';
/* ---------- i18n ---------- */
const L={
en:{app:'Audio Shelf',all:'All',en:'English',it:'Italian',empty:'Your shelves are empty.',addFirst:'Add your first book',
 add:'Add a book',upload:'From phone',catalog:'Free catalog',sites:'Free websites',
 pickAudio:'Choose audio files',pickCover:'Choose cover image (optional)',nfiles:n=>n+' file'+(n==1?'':'s')+' selected',coverOk:'Cover selected',
 bTitle:'Title',bAuthor:'Author',bLang:'Book language',save:'Add to library',needFiles:'Choose at least one audio file.',
 upNote:'Each file becomes one chapter, sorted by file name.',saving:'Saving…',added:'Added to library',
 search:'Title or author',go:'Search',searching:'Searching…',nores:'No books found.',neterr:'Could not reach the catalog. Check your connection.',
 addBtn:'Add',inLib:'In library',more:'More results',genre:'Genre',gAll:'All genres',catNote:'Public-domain recordings from LibriVox, hosted by the Internet Archive.',
 sitesNote:'Open a site, download the audio files to your phone, then add them under “From phone”.',
 play:'Play',resume:'Resume',chapters:'Chapters',chapter:'Chapter',dl:'Save offline',dling:(a,b)=>'Saving '+a+'/'+b+' — tap to stop',
 rmdl:'Remove offline copy',offline:'Saved offline',dlfail:'Download failed. The book still plays online.',del:'Delete book',
 delQ:'Delete this book from your library?',settings:'Settings',uiLang:'App language',theme:'Theme',dark:'Dark',light:'Light',
 storage:'Storage used',version:'Version',sleepOff:'☾ Sleep timer',sleepMin:m=>'☾ '+m+' min',sleepEnd:'☾ End of chapter',
 playErr:'Cannot play this chapter.',restart:'Start over',local:'On this phone',online:'Streaming',by:'by'},
it:{app:'Audio Shelf',all:'Tutti',en:'Inglese',it:'Italiano',empty:'I tuoi scaffali sono vuoti.',addFirst:'Aggiungi il primo libro',
 add:'Aggiungi un libro',upload:'Dal telefono',catalog:'Catalogo gratuito',sites:'Siti gratuiti',
 pickAudio:'Scegli i file audio',pickCover:'Scegli la copertina (facoltativa)',nfiles:n=>n+' file selezionat'+(n==1?'o':'i'),coverOk:'Copertina selezionata',
 bTitle:'Titolo',bAuthor:'Autore',bLang:'Lingua del libro',save:'Aggiungi alla libreria',needFiles:'Scegli almeno un file audio.',
 upNote:'Ogni file diventa un capitolo, in ordine di nome.',saving:'Salvataggio…',added:'Aggiunto alla libreria',
 search:'Titolo o autore',go:'Cerca',searching:'Ricerca…',nores:'Nessun libro trovato.',neterr:'Catalogo non raggiungibile. Controlla la connessione.',
 addBtn:'Aggiungi',inLib:'In libreria',more:'Altri risultati',genre:'Genere',gAll:'Tutti i generi',catNote:'Registrazioni di pubblico dominio di LibriVox, ospitate da Internet Archive.',
 sitesNote:'Apri un sito, scarica i file audio sul telefono, poi aggiungili da “Dal telefono”.',
 play:'Ascolta',resume:'Riprendi',chapters:'Capitoli',chapter:'Capitolo',dl:'Salva offline',dling:(a,b)=>'Salvataggio '+a+'/'+b+' — tocca per fermare',
 rmdl:'Rimuovi copia offline',offline:'Salvato offline',dlfail:'Download non riuscito. Il libro resta ascoltabile online.',del:'Elimina libro',
 delQ:'Eliminare questo libro dalla libreria?',settings:'Impostazioni',uiLang:'Lingua dell’app',theme:'Tema',dark:'Scuro',light:'Chiaro',
 storage:'Spazio usato',version:'Versione',sleepOff:'☾ Timer sonno',sleepMin:m=>'☾ '+m+' min',sleepEnd:'☾ Fine capitolo',
 playErr:'Impossibile riprodurre questo capitolo.',restart:'Ricomincia',local:'Sul telefono',online:'Streaming',by:'di'}
};
const LS={get(k,d){try{const v=localStorage.getItem('as_'+k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem('as_'+k,v)}catch(e){}}};
let ui=LS.get('ui',(navigator.language||'en').toLowerCase().startsWith('it')?'it':'en');
const t=(k,...a)=>{const v=(L[ui]||L.en)[k]??L.en[k]??k;return typeof v==='function'?v(...a):v};
const SITES=[
 {n:'LibriVox',u:'https://librivox.org/',l:'EN · IT',en:'Volunteer-read public-domain books, many languages.',it:'Libri di pubblico dominio letti da volontari, in molte lingue.'},
 {n:'Internet Archive – Audio Books',u:'https://archive.org/details/audio_bookspoetry',l:'EN · IT',en:'Huge free audio book and poetry collection.',it:'Vasta raccolta gratuita di audiolibri e poesia.'},
 {n:'Project Gutenberg',u:'https://www.gutenberg.org/',l:'EN · IT',en:'Classic e-books, with a human-read audio section.',it:'Classici in e-book, con una sezione di audiolibri letti.'},
 {n:'Loyal Books',u:'https://www.loyalbooks.com/',l:'EN · IT',en:'Easy browsing of public-domain audio books by genre and language.',it:'Audiolibri di pubblico dominio per genere e lingua.'},
 {n:'Lit2Go',u:'https://etc.usf.edu/lit2go/',l:'EN',en:'Stories and poems as MP3, from the University of South Florida.',it:'Racconti e poesie in MP3 (in inglese).'},
 {n:'Liber Liber',u:'https://liberliber.it/',l:'IT',en:'Italian classics, including free audio books.',it:'Classici italiani, con audiolibri gratuiti (Libro parlato).'},
 {n:'RaiPlay Sound – Ad alta voce',u:'https://www.raiplaysound.it/programmi/adaltavoce',l:'IT',en:'Italian radio readings of great novels (listen on the site).',it:'Grandi romanzi letti alla radio (ascolto sul sito).'}
];
const GENRES=[
 {k:'fiction',en:'Fiction & novels',it:'Narrativa e romanzi',s:'fiction OR novel OR novels OR romanzo OR romanzi OR narrativa'},
 {k:'children',en:'Children',it:'Bambini e ragazzi',s:'children OR juvenile OR "fairy tales" OR bambini OR ragazzi OR fiabe OR favole'},
 {k:'short',en:'Short stories',it:'Racconti',s:'"short stories" OR "short story" OR racconti OR novelle'},
 {k:'poetry',en:'Poetry',it:'Poesia',s:'poetry OR poems OR poem OR poesia OR poesie'},
 {k:'mystery',en:'Mystery & crime',it:'Gialli',s:'mystery OR detective OR crime OR giallo OR gialli'},
 {k:'adventure',en:'Adventure',it:'Avventura',s:'adventure OR avventura'},
 {k:'scifi',en:'Sci-fi & fantasy',it:'Fantascienza e fantasy',s:'"science fiction" OR fantasy OR fantascienza OR fantastico'},
 {k:'romance',en:'Romance',it:'Romantico',s:'romance OR "love stories" OR romantico OR amore'},
 {k:'drama',en:'Theatre & plays',it:'Teatro',s:'drama OR plays OR play OR theater OR theatre OR teatro OR commedia OR tragedia'},
 {k:'humor',en:'Humour',it:'Umorismo',s:'humor OR humour OR satire OR comedy OR umorismo OR satira'},
 {k:'history',en:'History & biography',it:'Storia e biografie',s:'history OR biography OR memoirs OR storia OR biografia'},
 {k:'philosophy',en:'Philosophy & religion',it:'Filosofia e religione',s:'philosophy OR religion OR filosofia OR religione'},
 {k:'nonfiction',en:'Other non-fiction',it:'Altra saggistica',s:'"non-fiction" OR nonfiction OR essays OR science OR travel OR saggi OR saggistica OR scienza OR viaggi'}
];
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>{if(!isFinite(s)||s<0)s=0;s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0')};
const parseLen=v=>{if(v==null)return 0;v=String(v);if(v.includes(':'))return v.split(':').reduce((a,b)=>a*60+(+b||0),0);return +v||0};
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const first=v=>Array.isArray(v)?v[0]:v;
let toastT;function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',3200)}
/* ---------- IndexedDB ---------- */
let dbp;
function db(){return dbp||(dbp=new Promise((res,rej)=>{const r=indexedDB.open('audioshelf',1);
 r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('books',{keyPath:'id'});d.createObjectStore('audio');d.createObjectStore('covers')};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))}
async function tx(store,mode,fn){const d=await db();return new Promise((res,rej)=>{const x=d.transaction(store,mode);const rq=fn(x.objectStore(store));
 x.oncomplete=()=>res(rq&&rq.result);x.onerror=x.onabort=()=>rej(x.error)})}
const dbGet=(s,k)=>tx(s,'readonly',o=>o.get(k));
const dbPut=(s,v,k)=>tx(s,'readwrite',o=>k===undefined?o.put(v):o.put(v,k));
const dbDel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const dbAll=s=>tx(s,'readonly',o=>o.getAll());
/* ---------- state ---------- */
let books=[];const coverUrls={};
let filter=LS.get('filter','all');
let view={v:'lib'};
async function loadBooks(){books=(await dbAll('books')).sort((a,b)=>b.added-a.added);
 for(const b of books){if(b.hasCover&&!coverUrls[b.id]){const bl=await dbGet('covers',b.id);if(bl)coverUrls[b.id]=URL.createObjectURL(bl)}}}
const book=id=>books.find(b=>b.id===id);
const saveBook=b=>dbPut('books',b);
function coverSrc(b){return coverUrls[b.id]||b.coverUrl||''}
function coverHTML(b,extra=''){const s=coverSrc(b);
 return `<div class="cover" style="--h:${hue(b.title)}"><span>${esc(b.title)}</span>${s?`<img src="${esc(s)}" alt="" loading="lazy" onerror="this.remove()">`:''}${extra}</div>`}
function progress(b){if(!b.chapters.length)return 0;const p=b.pos||{ch:0,t:0};const d=b.chapters[p.ch]&&b.chapters[p.ch].dur;
 return Math.min(1,(p.ch+(d?Math.min(1,p.t/d):0))/b.chapters.length)}
/* ---------- navigation ---------- */
function nav(v){view=v;history.pushState(v,'');render()}
window.addEventListener('popstate',e=>{if($('#sheet').classList.contains('on')){$('#sheet').classList.remove('on')}view=e.state||{v:'lib'};render()});
$('#back').onclick=()=>history.back();
$('#btnAdd').onclick=()=>nav({v:'add',tab:'upload'});
$('#btnSet').onclick=()=>nav({v:'set'});
function render(){
 document.documentElement.lang=ui;
 document.documentElement.dataset.theme=LS.get('theme','dark');
 const home=view.v==='lib';
 $('#back').hidden=home;$('#btnAdd').hidden=!home;$('#btnSet').hidden=!home;
 const m=$('#main');
 if(home){$('#title').innerHTML=esc(t('app'))+`<small>v${VERSION}</small>`;renderLib(m)}
 else if(view.v==='book'){const b=book(view.id);if(!b){view={v:'lib'};return render()}$('#title').textContent=b.title;renderBook(m,b)}
 else if(view.v==='add'){$('#title').textContent=t('add');renderAdd(m)}
 else if(view.v==='set'){$('#title').textContent=t('settings');renderSet(m)}
 window.scrollTo(0,0);updatePlayerUI();
}
/* ---------- library ---------- */
function renderLib(m){
 const list=books.filter(b=>filter==='all'||b.lang===filter);
 let h=`<div class="chips">${['all','en','it'].map(f=>`<button class="chip ${filter===f?'on':''}" data-f="${f}">${t(f)}</button>`).join('')}</div>`;
 if(!list.length)h+=`<div class="empty"><p>${t('empty')}</p><button class="btn" id="addFirst">＋ ${t('addFirst')}</button></div>`;
 for(let i=0;i<list.length;i+=3){h+='<div class="shelf">'+list.slice(i,i+3).map(b=>
  `<button class="bk" data-id="${b.id}" aria-label="${esc(b.title)}">${coverHTML(b,`<b class="flag">${b.lang.toUpperCase()}</b><div class="bar"><i style="width:${Math.round(progress(b)*100)}%"></i></div>`)}</button>`).join('')+'</div>'}
 m.innerHTML=h;
 m.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{filter=c.dataset.f;LS.set('filter',filter);render()});
 m.querySelectorAll('.bk').forEach(c=>c.onclick=()=>nav({v:'book',id:c.dataset.id}));
 const a=$('#addFirst');if(a)a.onclick=()=>nav({v:'add',tab:'upload'});
}
/* ---------- book ---------- */
const dlJobs={};
function isOffline(b){return b.source==='local'||b.chapters.every(c=>c.off)}
function renderBook(m,b){
 const p=b.pos||{ch:0,t:0};const started=p.ch>0||p.t>5;const job=dlJobs[b.id];
 const offN=b.chapters.filter(c=>c.off).length;
 let dl='';
 if(b.source==='ia'){
  if(job)dl=`<button class="btn ghost" id="dl">${t('dling',job.done,b.chapters.length)}</button>`;
  else if(offN===b.chapters.length)dl=`<button class="btn ghost" id="rmdl">✓ ${t('rmdl')}</button>`;
  else dl=`<button class="btn ghost" id="dl">⬇ ${t('dl')}</button>`;
 }
 m.innerHTML=`<div class="hero">${coverHTML(b)}<div><h2>${esc(b.title)}</h2><p>${esc(b.author||'')}</p>
  <p class="sans" style="font-size:13px;margin-top:8px">${t(b.lang)} · ${b.chapters.length} ${t('chapters').toLowerCase()}<br>${isOffline(b)?t(b.source==='local'?'local':'offline'):t('online')}</p></div></div>
  <div class="row"><button class="btn" id="bPlay">▶ ${started?t('resume'):t('play')}</button>${started?`<button class="btn ghost" id="bRestart">${t('restart')}</button>`:''}</div>
  <div class="row">${dl}</div>
  <ul class="list">${b.chapters.map((c,i)=>`<li><button class="ch ${player.id===b.id&&player.ch===i?'cur':''} ${i<p.ch?'done':''}" data-i="${i}">
   <span class="n">${i+1}</span><span class="t">${esc(c.title)}</span><span class="d">${c.off&&b.source==='ia'?'⬇ ':''}${c.dur?fmt(c.dur):''}</span></button></li>`).join('')}</ul>
  <button class="btn danger wide" id="bDel">${t('del')}</button>`;
 $('#bPlay').onclick=()=>playBook(b.id,p.ch,p.t);
 const r=$('#bRestart');if(r)r.onclick=()=>playBook(b.id,0,0);
 m.querySelectorAll('.ch').forEach(c=>c.onclick=()=>{const i=+c.dataset.i;playBook(b.id,i,i===p.ch?p.t:0)});
 const d=$('#dl');if(d)d.onclick=()=>job?(job.stop=true):downloadBook(b);
 const rm=$('#rmdl');if(rm)rm.onclick=()=>removeOffline(b);
 $('#bDel').onclick=()=>deleteBook(b);
}
async function downloadBook(b){
 if(dlJobs[b.id])return;const job=dlJobs[b.id]={done:b.chapters.filter(c=>c.off).length,stop:false};
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
 const rr=()=>{if(view.v==='book'&&view.id===b.id)renderBook($('#main'),b)};rr();
 try{
  if(!b.hasCover&&b.coverUrl){try{const r=await fetch(b.coverUrl);if(r.ok){const bl=await r.blob();await dbPut('covers',bl,b.id);b.hasCover=true;coverUrls[b.id]=URL.createObjectURL(bl)}}catch(e){}}
  for(let i=0;i<b.chapters.length&&!job.stop;i++){const c=b.chapters[i];if(c.off)continue;
   const r=await fetch(c.url);if(!r.ok)throw new Error(r.status);const bl=await r.blob();
   await dbPut('audio',bl,b.id+'|'+i);c.off=true;c.size=bl.size;await saveBook(b);job.done++;rr()}
 }catch(e){toast(t('dlfail'))}
 delete dlJobs[b.id];rr();
}
async function removeOffline(b){
 for(let i=0;i<b.chapters.length;i++){if(b.chapters[i].off){await dbDel('audio',b.id+'|'+i);delete b.chapters[i].off}}
 await saveBook(b);render();
}
async function deleteBook(b){
 if(!confirm(t('delQ')))return;
 if(player.id===b.id)stopPlayer();
 for(let i=0;i<b.chapters.length;i++)await dbDel('audio',b.id+'|'+i);
 await dbDel('covers',b.id);await dbDel('books',b.id);
 if(coverUrls[b.id]){URL.revokeObjectURL(coverUrls[b.id]);delete coverUrls[b.id]}
 await loadBooks();history.back();
}
/* ---------- add ---------- */
let cat={lang:LS.get('catLang',ui),genre:'',q:'',page:1,rows:[],busy:false,more:false,err:false,done:false};
function renderAdd(m){
 const tab=view.tab||'upload';
 let h=`<div class="chips">${['upload','catalog','sites'].map(x=>`<button class="chip ${tab===x?'on':''}" data-t="${x}">${t(x)}</button>`).join('')}</div>`;
 if(tab==='upload')h+=`
  <p class="note">${t('upNote')}</p>
  <label class="filebtn"><input type="file" id="fAudio" accept="audio/*,.mp3,.m4a,.m4b,.ogg,.opus,.wav,.flac,.aac" multiple><span class="btn ghost wide" id="fAudioL">🎧 ${t('pickAudio')}</span></label>
  <label class="filebtn"><input type="file" id="fCover" accept="image/*"><span class="btn ghost wide" id="fCoverL">🖼 ${t('pickCover')}</span></label>
  <label for="uT">${t('bTitle')}</label><input type="text" id="uT" autocomplete="off">
  <label for="uA">${t('bAuthor')}</label><input type="text" id="uA" autocomplete="off">
  <label for="uL">${t('bLang')}</label><select id="uL"><option value="en">${t('en')}</option><option value="it" ${ui==='it'?'selected':''}>${t('it')}</option></select>
  <div class="row"><button class="btn wide" id="uSave">${t('save')}</button></div>`;
 else if(tab==='catalog'){h+=`
  <p class="note">${t('catNote')}</p>
  <div class="chips">${['en','it'].map(l=>`<button class="chip ${cat.lang===l?'on':''}" data-l="${l}">${t(l)}</button>`).join('')}</div>
  <select id="sG" aria-label="${t('genre')}" style="margin-bottom:10px"><option value="">${t('gAll')}</option>${GENRES.map(g=>`<option value="${g.k}" ${cat.genre===g.k?'selected':''}>${esc(g[ui]||g.en)}</option>`).join('')}</select>
  <form id="sForm" style="display:flex;gap:8px"><input type="search" id="sQ" placeholder="${t('search')}" value="${esc(cat.q)}" enterkeyhint="search"><button class="btn">${t('go')}</button></form>
  <div id="sRes">${resHTML()}</div>`}
 else h+=`<p class="note">${t('sitesNote')}</p>`+SITES.map(s=>`<a class="site" href="${s.u}" target="_blank" rel="noopener"><b>${esc(s.n)}</b> <span class="sans" style="font-size:12px;color:var(--dim)">${s.l}</span><small>${esc(s[ui]||s.en)}</small></a>`).join('');
 m.innerHTML=h;
 m.querySelectorAll('.chip[data-t]').forEach(c=>c.onclick=()=>{view={v:'add',tab:c.dataset.t};history.replaceState(view,'');render()});
 if(tab==='upload')bindUpload();
 if(tab==='catalog'){
  m.querySelectorAll('.chip[data-l]').forEach(c=>c.onclick=()=>{cat.lang=c.dataset.l;LS.set('catLang',cat.lang);cat.page=1;cat.rows=[];search()});
  $('#sG').onchange=()=>{cat.genre=$('#sG').value;cat.q=$('#sQ').value.trim();cat.page=1;cat.rows=[];search()};
  $('#sForm').onsubmit=e=>{e.preventDefault();cat.q=$('#sQ').value.trim();cat.page=1;cat.rows=[];$('#sQ').blur();search()};
  bindRes();if(!cat.done&&!cat.busy)search();
 }
}
function bindUpload(){
 const fa=$('#fAudio'),fc=$('#fCover');
 fa.onchange=()=>{const n=fa.files.length;$('#fAudioL').textContent=n?'🎧 '+t('nfiles',n):'🎧 '+t('pickAudio');
  if(n&&!$('#uT').value){const f=[...fa.files].sort(byName)[0];$('#uT').value=cleanName(f.name).replace(/[\s_\-–.]*(ch(apter)?|cap(itolo)?|part|parte|track)?[\s_\-.]*0*1$/i,'').trim()||cleanName(f.name)}};
 fc.onchange=()=>{$('#fCoverL').textContent=fc.files.length?'✓ '+t('coverOk'):'🖼 '+t('pickCover')};
 $('#uSave').onclick=async()=>{
  const files=[...fa.files].sort(byName);if(!files.length)return toast(t('needFiles'));
  const btn=$('#uSave');btn.disabled=true;btn.textContent=t('saving');
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  const id='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const single=files.length===1;
  const b={id,title:$('#uT').value.trim()||cleanName(files[0].name),author:$('#uA').value.trim(),lang:$('#uL').value,source:'local',added:Date.now(),
   chapters:files.map((f,i)=>({title:single?t('chapter')+' 1':cleanName(f.name),size:f.size,off:true})),pos:{ch:0,t:0}};
  try{
   for(let i=0;i<files.length;i++)await dbPut('audio',files[i],id+'|'+i);
   if(fc.files[0]){await dbPut('covers',fc.files[0],id);b.hasCover=true}
   await saveBook(b);await loadBooks();toast(t('added'));view={v:'book',id};history.replaceState(view,'');render();
  }catch(e){toast(String(e&&e.message||e));btn.disabled=false;btn.textContent=t('save')}
 };
}
const byName=(a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true,sensitivity:'base'});
const cleanName=n=>n.replace(/\.[a-z0-9]{2,5}$/i,'').replace(/_/g,' ').trim();
/* catalog (Internet Archive / LibriVox) */
function resHTML(){
 if(cat.err)return `<p class="note">${t('neterr')}</p>`;
 let h=cat.rows.map(r=>{const inl=books.some(b=>b.iaId===r.id);
  return `<div class="res">${coverHTML({id:'x',title:r.title,coverUrl:'https://archive.org/services/img/'+encodeURIComponent(r.id)})}
   <div class="m"><b>${esc(r.title)}</b><small>${esc(r.author)}</small></div>
   <button class="btn ${inl?'ghost':''} sans" data-ia="${esc(r.id)}" ${inl?'disabled':''}>${inl?'✓':t('addBtn')}</button></div>`}).join('');
 if(cat.busy)h+=`<p class="note">${t('searching')}</p>`;
 else if(!cat.rows.length&&cat.done)h+=`<p class="note">${t('nores')}</p>`;
 else if(cat.more)h+=`<div class="row"><button class="btn ghost wide" id="sMore">${t('more')}</button></div>`;
 return h;
}
function refreshRes(){const e=$('#sRes');if(e&&view.v==='add'&&view.tab==='catalog'){e.innerHTML=resHTML();bindRes();
 document.querySelectorAll('.chip[data-l]').forEach(c=>c.classList.toggle('on',c.dataset.l===cat.lang))}}
function bindRes(){
 document.querySelectorAll('[data-ia]').forEach(b=>b.onclick=()=>addFromIA(b.dataset.ia,b));
 const m=$('#sMore');if(m)m.onclick=()=>{cat.page++;search()};
}
async function search(){
 cat.busy=true;cat.err=false;refreshRes();
 const lang=cat.lang==='it'?'(Italian OR ita OR it)':'(English OR eng OR en)';
 const words=cat.q.replace(/[^\p{L}\p{N}\s']/gu,' ').trim();
 let q=`collection:librivoxaudio AND mediatype:audio AND language:${lang}`;
 const g=GENRES.find(x=>x.k===cat.genre);if(g)q+=` AND subject:(${g.s})`;
 if(words)q+=` AND (title:(${words}) OR creator:(${words}))`;
 const u='https://archive.org/advancedsearch.php?q='+encodeURIComponent(q)+'&fl[]=identifier&fl[]=title&fl[]=creator&rows=25&page='+cat.page+'&sort[]='+encodeURIComponent('downloads desc')+'&output=json';
 const my=cat.lang+'|'+cat.genre+'|'+cat.q+'|'+cat.page;cat.key=my;
 try{const r=await fetch(u);if(!r.ok)throw 0;const j=await r.json();if(cat.key!==my)return;
  const docs=j.response.docs||[];
  cat.rows.push(...docs.map(d=>({id:d.identifier,title:String(first(d.title)||d.identifier),author:[].concat(d.creator||[]).join(', ')})));
  cat.more=j.response.numFound>cat.rows.length;
 }catch(e){if(cat.key!==my)return;cat.err=true}
 cat.busy=false;cat.done=true;refreshRes();
}
async function addFromIA(iaId,btn){
 btn.disabled=true;btn.textContent='…';
 try{
  const r=await fetch('https://archive.org/metadata/'+encodeURIComponent(iaId));if(!r.ok)throw 0;const j=await r.json();
  const files=(j.files||[]).filter(f=>/\.(mp3|m4a|m4b|ogg)$/i.test(f.name));
  const pick=['64Kbps MP3','VBR MP3','128Kbps MP3'].map(fm=>files.filter(f=>f.format===fm)).find(a=>a.length)
   ||[files.filter(f=>/\.mp3$/i.test(f.name)),files].find(a=>a.length);
  if(!pick||!pick.length)throw 0;
  pick.sort(byName);
  const md=j.metadata||{};
  const id='b'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const b={id,iaId,source:'ia',title:String(first(md.title)||iaId),author:[].concat(md.creator||[]).join(', '),lang:cat.lang,added:Date.now(),
   coverUrl:'https://archive.org/services/img/'+encodeURIComponent(iaId),pos:{ch:0,t:0},
   chapters:pick.map((f,i)=>({title:String(f.title||cleanName(f.name)),dur:parseLen(f.length),
    url:'https://archive.org/download/'+encodeURIComponent(iaId)+'/'+f.name.split('/').map(encodeURIComponent).join('/')}))};
  await saveBook(b);await loadBooks();toast(t('added'));btn.textContent='✓';btn.classList.add('ghost');
 }catch(e){toast(t('neterr'));btn.disabled=false;btn.textContent=t('addBtn')}
}
/* ---------- settings ---------- */
function renderSet(m){
 const th=LS.get('theme','dark');
 m.innerHTML=`<label>${t('uiLang')}</label><div class="chips">${['en','it'].map(l=>`<button class="chip ${ui===l?'on':''}" data-u="${l}">${l==='en'?'English':'Italiano'}</button>`).join('')}</div>
  <label>${t('theme')}</label><div class="chips">${['dark','light'].map(x=>`<button class="chip ${th===x?'on':''}" data-th="${x}">${t(x)}</button>`).join('')}</div>
  <label>${t('storage')}</label><p class="sans" id="stor">…</p>
  <label>${t('version')}</label><p class="sans">Audio Shelf ${VERSION}</p>`;
 m.querySelectorAll('[data-u]').forEach(c=>c.onclick=()=>{ui=c.dataset.u;LS.set('ui',ui);render()});
 m.querySelectorAll('[data-th]').forEach(c=>c.onclick=()=>{LS.set('theme',c.dataset.th);render()});
 if(navigator.storage&&navigator.storage.estimate)navigator.storage.estimate().then(e=>{const s=$('#stor');if(s)s.textContent=(e.usage/1048576).toFixed(0)+' MB / '+(e.quota/1073741824).toFixed(1)+' GB'}).catch(()=>{});
 else $('#stor').textContent='–';
}
/* ---------- player ---------- */
const au=$('#au');
const player={id:null,ch:0,url:null,seekTo:0,lastSave:0,sleepAt:0,sleepEnd:false,sleepT:null};
const SPEEDS=[0.75,1,1.25,1.5,1.75,2];let speed=+LS.get('speed',1)||1;
async function playBook(id,ch,tm,auto=true){
 const b=book(id);if(!b||!b.chapters[ch])return;
 savePos();
 player.id=id;player.ch=ch;player.seekTo=tm||0;
 if(player.url){URL.revokeObjectURL(player.url);player.url=null}
 const c=b.chapters[ch];let src=c.url;
 if(c.off||b.source==='local'){const bl=await dbGet('audio',id+'|'+ch);if(bl){player.url=URL.createObjectURL(bl);src=player.url}}
 if(!src){toast(t('playErr'));return}
 au.src=src;au.playbackRate=speed;
 b.pos={ch,t:player.seekTo};saveBook(b);
 LS.set('last',id);
 if(auto)au.play().catch(()=>{});
 setMediaSession(b);updatePlayerUI();
 if(view.v==='book'&&view.id===id)renderBook($('#main'),b);
}
function stopPlayer(){au.pause();au.removeAttribute('src');au.load();player.id=null;updatePlayerUI()}
function savePos(force){const b=book(player.id);if(!b||!au.src||au.readyState<1)return;
 b.pos={ch:player.ch,t:au.currentTime||0};const c=b.chapters[player.ch];if(isFinite(au.duration)&&au.duration>0)c.dur=au.duration;saveBook(b)}
au.addEventListener('loadedmetadata',()=>{if(player.seekTo>0&&player.seekTo<(au.duration||Infinity)-2)au.currentTime=player.seekTo;player.seekTo=0;au.playbackRate=speed;
 const b=book(player.id);if(b&&isFinite(au.duration)){b.chapters[player.ch].dur=au.duration}updateTime()});
au.addEventListener('timeupdate',()=>{updateTime();const n=Date.now();if(n-player.lastSave>5000){player.lastSave=n;savePos()}});
au.addEventListener('pause',()=>{savePos();updatePlayerUI()});
au.addEventListener('play',updatePlayerUI);
au.addEventListener('ended',()=>{const b=book(player.id);if(!b)return;
 if(player.sleepEnd){player.sleepEnd=false;updateSleepLabel();if(player.ch<b.chapters.length-1)playBook(b.id,player.ch+1,0,false);return}
 if(player.ch<b.chapters.length-1)playBook(b.id,player.ch+1,0);else{b.pos={ch:0,t:0};saveBook(b);updatePlayerUI()}});
au.addEventListener('error',()=>{if(player.id&&au.src)toast(t('playErr'))});
document.addEventListener('visibilitychange',()=>{if(document.hidden)savePos()});
window.addEventListener('pagehide',()=>savePos());
function toggle(){if(!player.id)return;au.paused?au.play().catch(()=>{}):au.pause()}
function skip(d){if(!player.id)return;au.currentTime=Math.max(0,Math.min((au.duration||1e9)-1,au.currentTime+d))}
function chStep(d){const b=book(player.id);if(!b)return;
 if(d<0&&au.currentTime>5){au.currentTime=0;return}
 const n=player.ch+d;if(n>=0&&n<b.chapters.length)playBook(b.id,n,0,!au.paused||true)}
function updateTime(){
 const d=au.duration,c=au.currentTime||0;
 if(!seeking){$('#seek').value=isFinite(d)&&d>0?Math.round(c/d*1000):0;$('#tCur').textContent=fmt(c)}
 $('#tDur').textContent=isFinite(d)?fmt(d):'–:––';
 $('#miniProg').style.width=(isFinite(d)&&d>0?c/d*100:0)+'%';
}
function updatePlayerUI(){
 const b=book(player.id);const mini=$('#mini');
 mini.classList.toggle('on',!!b);if(!b){$('#sheet').classList.remove('on');return}
 const c=b.chapters[player.ch];const icon=au.paused?'▶':'❚❚';
 $('#miniPlay').textContent=icon;$('#play').textContent=icon;
 const key=b.id+'|'+coverSrc(b);
 if(mini.dataset.k!==key){mini.dataset.k=key;$('#miniCover').innerHTML=coverHTML(b);$('#shCover').innerHTML=coverHTML(b)}
 $('#miniT').textContent=b.title;$('#miniC').textContent=(player.ch+1)+'. '+c.title;
 $('#shT').textContent=b.title;$('#shA').textContent=b.author||'';$('#shC').textContent=(player.ch+1)+'/'+b.chapters.length+' · '+c.title;
 $('#speed').textContent=speed+'×';updateSleepLabel();updateTime();
}
let seeking=false;
$('#seek').addEventListener('input',()=>{seeking=true;if(isFinite(au.duration))$('#tCur').textContent=fmt($('#seek').value/1000*au.duration)});
$('#seek').addEventListener('change',()=>{if(isFinite(au.duration))au.currentTime=$('#seek').value/1000*au.duration;seeking=false});
$('#miniPlay').onclick=toggle;$('#play').onclick=toggle;
$('#rw').onclick=()=>skip(-15);$('#ff').onclick=()=>skip(30);
$('#prev').onclick=()=>chStep(-1);$('#next').onclick=()=>chStep(1);
$('#miniOpen').onclick=()=>{history.pushState(view,'');$('#sheet').classList.add('on')};
$('#shClose').onclick=()=>history.back();
$('#shList').onclick=()=>{$('#sheet').classList.remove('on');view={v:'book',id:player.id};history.replaceState(view,'');render()};
$('#speed').onclick=()=>{speed=SPEEDS[(SPEEDS.indexOf(speed)+1)%SPEEDS.length];LS.set('speed',speed);au.playbackRate=speed;$('#speed').textContent=speed+'×'};
const SLEEPS=[0,15,30,60,-1];let sleepI=0;
$('#sleep').onclick=()=>{sleepI=(sleepI+1)%SLEEPS.length;const v=SLEEPS[sleepI];clearTimeout(player.sleepT);player.sleepEnd=false;player.sleepMin=0;
 if(v>0){player.sleepMin=v;player.sleepT=setTimeout(()=>{au.pause();sleepI=0;player.sleepMin=0;updateSleepLabel()},v*60000)}else if(v<0)player.sleepEnd=true;
 updateSleepLabel()};
function updateSleepLabel(){if(!player.sleepEnd&&!player.sleepMin)sleepI=0;
 $('#sleep').textContent=player.sleepEnd?t('sleepEnd'):player.sleepMin?t('sleepMin',player.sleepMin):t('sleepOff')}
function setMediaSession(b){
 if(!('mediaSession' in navigator))return;
 try{const s=coverSrc(b);
  navigator.mediaSession.metadata=new MediaMetadata({title:(player.ch+1)+'. '+b.chapters[player.ch].title,artist:b.author||'',album:b.title,artwork:s?[{src:s,sizes:'512x512'}]:[]});
  const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
  h('play',()=>au.play());h('pause',()=>au.pause());
  h('seekbackward',()=>skip(-15));h('seekforward',()=>skip(30));
  h('previoustrack',()=>chStep(-1));h('nexttrack',()=>chStep(1));
  h('seekto',e=>{if(e.seekTime!=null)au.currentTime=e.seekTime});
 }catch(e){}
}
/* ---------- boot ---------- */
(async()=>{
 history.replaceState(view,'');
 try{await loadBooks()}catch(e){toast(String(e&&e.message||e))}
 render();
 const last=book(LS.get('last',''));
 if(last&&last.pos)playBook(last.id,Math.min(last.pos.ch,last.chapters.length-1),last.pos.t,false);
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
